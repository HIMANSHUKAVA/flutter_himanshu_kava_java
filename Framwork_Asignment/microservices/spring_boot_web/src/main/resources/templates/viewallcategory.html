<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
   <h1>category table</h1>
   
   <table border="1">
   
        <thead>
                  <tr>
                  
                       <th>Id</th>
                       <th>Name</th>
                 </tr>
                  
        </thead>
        
        <tbody>
        
             <tr th:each="cat : ${categories}">
            <td th:text="${cat.id}"></td>
            <td th:text="${cat.name}"></td>
        </tr> 
        
        </tbody>
   
   </table>
</body>
</html>
